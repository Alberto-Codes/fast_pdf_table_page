[project]
name = "fast-pdf-table-page"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.15.1",
    "opencv-python>=4.11.0.86",
    "pdf2image>=1.17.0",
    "pymupdf>=1.25.5",
    "structlog>=25.2.0",
    "timm>=1.0.15",
    "torch>=2.6.0",
    "transformers>=4.50.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_pdf_table_page"]

[project.scripts]
fast = "fast_pdf_table_page.main:main"
